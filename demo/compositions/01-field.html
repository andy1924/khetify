    <script>const F = 0.8;                       // whole-film speed-up
      const T = (x) => +(x * F).toFixed(3);  // scale an authored beat time

      const tl = gsap.timeline({ paused: true });

      gsap.set("#s1-phone", { scale: 0.9, opacity: 0, rotate: -7, y: 40 });
      gsap.set("#s1-copy > *", { opacity: 0, y: 26 });
      gsap.set("#s1-far", { y: 26, scale: 1.04 });
      gsap.set("#s1-near", { y: 60, scale: 1.06 });
      gsap.set("#s1-sun", { scale: 0.9, opacity: 0 });
      gsap.set("#s1-shot-a", { scale: 1.14 });
      gsap.set("#s1-shot-b", { scale: 1.14 });
      gsap.set("#s1-upload", { opacity: 0, y: 44 });
      gsap.set("#s1-flash", { opacity: 0 });
      gsap.set(".s1-br", { opacity: 0, scale: 1.22 });
      gsap.set("#s1-lock", { opacity: 0, scale: 1.5 });
      gsap.set("#s1-hint", { opacity: 0, y: -10 });
      gsap.set("#s1-modes, #s1-zoom, #s1-shutter, #s1-thumb", { opacity: 0, y: 18 });
      gsap.set("#s1-pill", { x: 0 });

      // 0.0 the field wakes
      tl.to("#s1-sun", { scale: 1, opacity: 1, duration: T(1.6), ease: "power2.out" }, T(0));
      tl.to("#s1-far", { y: 0, scale: 1, duration: T(2.3), ease: "power2.out" }, T(0));
      tl.to("#s1-near", { y: 0, scale: 1, duration: T(2.7), ease: "power2.out" }, T(0.12));

      // 0.25 the phone lifts into frame
      tl.to("#s1-phone", { scale: 1, opacity: 1, rotate: 0, y: 0, duration: T(1.35), ease: "expo.out" }, T(0.25));
      tl.to("#s1-modes, #s1-zoom, #s1-shutter, #s1-thumb", { opacity: 1, y: 0, duration: T(0.5), stagger: T(0.07), ease: "power3.out" }, T(0.95));

      // 1.15 the crop frame draws itself
      tl.to("#s1-grid", { opacity: 1, duration: T(0.4), ease: "power2.out" }, T(1.05));
      tl.to(".s1-br", { opacity: 1, scale: 1, duration: T(0.55), stagger: T(0.06), ease: "back.out(2.4)" }, T(1.1));
      tl.to("#s1-hint", { opacity: 1, y: 0, duration: T(0.45), ease: "power3.out" }, T(1.15));

      // 1.9 the frame locks, once
      tl.fromTo("#s1-lock", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: T(0.3), ease: "power3.out" }, T(1.95));
      tl.to(".s1-br", { scale: 1.06, duration: T(0.14), ease: "power2.out" }, T(1.95));
      tl.to(".s1-br", { scale: 1, duration: T(0.3), ease: "back.out(3)" }, T(2.09));
      tl.to("#s1-hint", { opacity: 0, duration: T(0.3), ease: "power2.in" }, T(2.75));
      tl.to("#s1-lock", { opacity: 0, duration: T(0.3), ease: "power2.in" }, T(2.5));

      // 2.0 copy lands
      tl.to("#s1-copy > *", { opacity: 1, y: 0, duration: T(0.6), stagger: T(0.1), ease: "power3.out" }, T(1.7));

      // 2.9 push toward the phone; the copy clears as the lens moves
      tl.to("#s1-cam", { scale: 1.1, x: -96, y: 46, duration: T(2.6), ease: "power2.inOut" }, T(3.0));
      tl.to("#s1-rig", { scale: 1.2, x: -70, y: 8, duration: T(2.6), ease: "power2.inOut" }, T(3.0));
      tl.to("#s1-copy", { opacity: 0, x: -44, duration: T(0.6), ease: "power2.in" }, T(3.7));

      // 3.7 the shutter: tap, flash, capture
      tl.to("#s1-shutter", { scale: 0.84, duration: T(0.1), ease: "power2.in" }, T(3.7));
      tl.to("#s1-shutter", { scale: 1, duration: T(0.34), ease: "back.out(2.6)" }, T(3.8));
      tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 0.92, duration: T(0.06), ease: "power1.in" }, T(3.78));
      tl.to("#s1-flash", { opacity: 0, duration: T(0.34), ease: "power2.out" }, T(3.86));
      tl.to("#s1-thumb", { background: "#e6f0d4", duration: T(0.12) }, T(3.8));
      tl.to("#s1-thumb", { background: "#cfe0bc", duration: T(0.3) }, T(3.95));

      // 4.4 the second photo: the leaf swaps to soil, the mode slides
      tl.to("#s1-shot-a", { opacity: 0, duration: T(0.34), ease: "power2.inOut" }, T(4.4));
      tl.to("#s1-shot-b", { opacity: 1, duration: T(0.34), ease: "power2.inOut" }, T(4.4));
      tl.fromTo("#s1-shot-b", { scale: 1.14 }, { scale: 1.0, duration: T(0.8), ease: "expo.out" }, T(4.4));
      tl.to("#s1-shot-a", { scale: 1.0, duration: T(0.8), ease: "expo.out" }, T(4.4));
      tl.to("#s1-pill", { x: 130, duration: T(0.38), ease: "power3.inOut" }, T(4.42));
      tl.call(() => {
        document.getElementById("s1-mode-a").classList.remove("on");
        document.getElementById("s1-mode-b").classList.add("on");
      }, null, T(4.6));
      tl.to(".s1-br", { scale: 1.05, duration: T(0.16), ease: "power2.out" }, T(4.42));
      tl.to(".s1-br", { scale: 1, duration: T(0.34), ease: "back.out(2.6)" }, T(4.58));

      // 5.4 second shutter
      tl.to("#s1-shutter", { scale: 0.84, duration: T(0.1), ease: "power2.in" }, T(5.4));
      tl.to("#s1-shutter", { scale: 1, duration: T(0.34), ease: "back.out(2.6)" }, T(5.5));
      tl.to("#s1-flash", { opacity: 0.9, duration: T(0.06), ease: "power1.in" }, T(5.48));
      tl.to("#s1-flash", { opacity: 0, duration: T(0.34), ease: "power2.out" }, T(5.56));

      // 5.9 the upload sheet
      tl.to("#s1-upload", { opacity: 1, y: 0, duration: T(0.55), ease: "expo.out" }, T(5.9));
      tl.to("#s1-thumb", { scale: 1.06, duration: T(0.3), ease: "power2.out" }, T(6.1));
      tl.to("#s1-thumb", { scale: 1, duration: T(0.3), ease: "power2.inOut" }, T(6.4));

      // 6.4 two photos upload
      tl.to("#s1-fill", { width: "52%", duration: T(1.5), ease: "power2.inOut" }, T(6.4));
      tl.to("#s1-pct-a", { opacity: 0, duration: T(0.16) }, T(7.86));
      tl.to("#s1-pct-b", { opacity: 1, duration: T(0.16) }, T(7.86));
      tl.to("#s1-count-a", { opacity: 0, duration: T(0.16) }, T(7.86));
      tl.to("#s1-count-b", { opacity: 1, duration: T(0.16) }, T(7.86));
      tl.to("#s1-fill", { width: "100%", duration: T(1.55), ease: "power2.inOut" }, T(8.05));
      tl.to("#s1-pct-b", { opacity: 0, duration: T(0.16) }, T(9.56));
      tl.to("#s1-pct-c", { opacity: 1, duration: T(0.16) }, T(9.56));
      tl.to("#s1-count-b", { opacity: 0, duration: T(0.16) }, T(9.56));
      tl.to("#s1-count-c", { opacity: 1, duration: T(0.16) }, T(9.56));
